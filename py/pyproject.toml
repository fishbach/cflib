[project]
name = "cflib"
version = "0.1.0"
description = "cflib Python client runtime: hand-written BER (de)serialization and RMI/RSig over WebSocket"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Christian Fischbach", email = "cf@cflib.de" }]
dependencies = ["websockets>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cflib"]
